#    password: 你的数据库密码
mybatis:
  mapper-locations: classpath:mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# logback由xml主导，yml只简单控制级别
logging:
  level:
    root: info
    com.photoshot: info  # 自己项目代码日志级别
    org.springframework: warn # 框架日志减少噪音
# 语义层模型配置：豆包（火山方舟）的 OpenAI 兼容接口
# model 填控制台的接入点 ID（ep-xxxxxxxx）或 Model ID；api-key 与 model 任一为空即降级到规则解析
llm:
  base-url: ${LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  model: ${LLM_MODEL:}
  api-key: ${LLM_API_KEY:}
  timeout-ms: 3000
